<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>officebots</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f5f1; --fg:#222; --mute:#777; --line:#ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1c1f; --fg:#e6e6e6; --mute:#999; --line:#333; } }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--mute); margin-bottom:16px; font-size:13px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
  th { font-size:12px; color:var(--mute); font-weight:500; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; vertical-align:middle; }
  .working { background:#3fb950; } .waiting { background:#d29922; } .sleeping { background:#8b949e; }
  .swatch { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:8px; vertical-align:middle; }
  .empty { color:var(--mute); padding:24px 0; }
</style>
</head>
<body>
<main>
  <h1 id="title">officebots</h1>
  <div class="sub" id="sub">connecting…</div>
  <table>
    <thead><tr><th>Role</th><th>Model</th><th>Status</th><th class="num">Tokens</th><th class="num">Interns</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>No agents seen yet. Start a Claude Code session in this project.</div>
</main>
<script>
  const rows = document.getElementById("rows");
  const fmt = (n) => n.toLocaleString();
  function cell(text, cls) { const td = document.createElement("td"); if (cls) td.className = cls; td.textContent = text; return td; }
  function render(room) {
    document.getElementById("title").textContent = room.project.name;
    document.getElementById("sub").textContent = "total " + fmt(room.totals.headline) + " tokens (output + fresh input)";
    document.getElementById("empty").hidden = room.characters.length > 0;
    rows.replaceChildren(...room.characters.map((c) => {
      const tr = document.createElement("tr");
      const role = document.createElement("td");
      const sw = document.createElement("span"); sw.className = "swatch"; sw.style.background = c.color;
      role.append(sw, c.role + (c.accountAlias ? " @" + c.accountAlias : ""));
      const status = document.createElement("td");
      const dot = document.createElement("span"); dot.className = "dot " + c.status;
      status.append(dot, c.status);
      const t = c.tokens;
      const tokens = cell(fmt(t.headline), "num");
      tokens.title = "input " + fmt(t.input) + ", output " + fmt(t.output) + ", cache write " + fmt(t.cacheWrite) +
        ", cache read " + fmt(t.cacheRead) + ", reasoning " + fmt(t.reasoning);
      const interns = c.interns.total ? c.interns.active + " / " + c.interns.total : "";
      tr.append(role, cell(c.tool + " · " + c.model), status, tokens, cell(interns, "num"));
      return tr;
    }));
  }
  function connect() {
    const ws = new WebSocket("ws://" + location.host + "/ws");
    ws.onmessage = (e) => { const m = JSON.parse(e.data); if (m.type === "room") render(m.room); };
    ws.onclose = () => { document.getElementById("sub").textContent = "disconnected, retrying…"; setTimeout(connect, 1500); };
  }
  connect();
</script>
</body>
</html>
